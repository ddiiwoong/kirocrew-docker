services:
  # ---------------------------------------------------------------------------
  # Tailscale 사이드카. 네트워크 네임스페이스의 "소유자"이므로
  # 포트 발행(ports)과 tailnet 진입점이 모두 이 컨테이너에 있다.
  # ---------------------------------------------------------------------------
  tailscale:
    image: tailscale/tailscale:stable
    container_name: kirocrew-tailscale
    hostname: ${TS_HOSTNAME:-kirocrew}
    restart: unless-stopped

    environment:
      # 인증: authkey 가 있으면 무인 로그인. 비워두면 대화형 로그인 URL 이
      # `docker compose logs -f tailscale` 에 출력된다.
      TS_AUTHKEY: "${TS_AUTHKEY:-}"

      # MagicDNS 이름이 된다 -> https://<TS_HOSTNAME>.<tailnet>.ts.net
      TS_HOSTNAME: "${TS_HOSTNAME:-kirocrew}"

      # 인증 상태를 볼륨에 보존. 이게 없으면 재시작마다 새 노드로 재인증한다.
      TS_STATE_DIR: /var/lib/tailscale

      # userspace 모드: /dev/net/tun 과 NET_ADMIN 없이 동작한다.
      # tailnet -> 컨테이너 인바운드(대시보드 접속)는 정상 동작한다.
      # 컨테이너에서 tailnet 의 다른 노드로 나가는 통신이 필요하면 false 로
      # 바꾸고 아래 devices/cap_add 주석을 해제할 것.
      TS_USERSPACE: "${TS_USERSPACE:-true}"

      # MagicDNS 가 컨테이너 resolv.conf 를 덮어써서 외부 DNS 를 깨는 것을 방지.
      TS_ACCEPT_DNS: "false"

      # 태그된 authkey 를 쓸 때: "--advertise-tags=tag:kirocrew"
      TS_EXTRA_ARGS: "${TS_EXTRA_ARGS:-}"

      # Funnel/Serve 를 선언형으로 자동 기동. 이 파일이 있으면 컨테이너가 뜰 때마다
      # 443(공개 Funnel) → 127.0.0.1:4180(oauth2-proxy) 포워딩이 자동 적용된다.
      # 즉 재부팅·재배포·복제에도 수동 `tailscale funnel` 명령 없이 공개가 유지된다.
      # ${TS_CERT_DOMAIN} 은 tailscale 이 자기 FQDN 으로 자동 치환하므로 하드코딩 불필요.
      # Google 로그인 벽 없이 대시보드를 바로 공개하려면 serve JSON 의 4180 을
      # ${KIROCREW_PORT} 로 바꾸면 된다(비권장 -- 토큰만 벽).
      # 이 공개 자동화를 끄려면 아래 두 줄(env + 마운트)을 주석 처리하면 된다.
      TS_SERVE_CONFIG: /config/serve.json

    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale-serve.json:/config/serve.json:ro

    # TS_USERSPACE=false (커널 모드) 로 바꿀 때만 필요:
    # devices:
    #   - /dev/net/tun:/dev/net/tun
    # cap_add:
    #   - NET_ADMIN
    #   - NET_RAW

    # 로컬 PC 접속용 포트. network_mode 를 공유하므로 kirocrew 쪽에는
    # ports 를 쓸 수 없고 반드시 여기 있어야 한다.
    ports:
      - "127.0.0.1:${HOST_PORT:-5476}:${KIROCREW_PORT:-5476}"

  # ---------------------------------------------------------------------------
  # OAuth2 Proxy -- Google(Gmail) 로그인 벽.
  #
  # 외부 사용자 → Funnel(443) → 이 proxy(:4180) → [Google 로그인] → kirocrew(:PORT)
  # tailscale 의 netns 를 공유하므로 세 컨테이너가 같은 127.0.0.1 을 쓴다.
  # proxy 는 upstream 으로 http://127.0.0.1:${KIROCREW_PORT} 를 바라본다.
  #
  # tailscale-serve.json 이 Funnel 을 4180 으로 자동 연결하므로, 이 서비스는
  # 기본 `up` 에서 항상 함께 뜬다(재부팅·재배포에도 자동). 공개가 필요 없으면
  # 이 서비스 블록과 tailscale 의 TS_SERVE_CONFIG 두 줄을 함께 주석 처리한다.
  # ---------------------------------------------------------------------------
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:latest
    container_name: kirocrew-oauth2-proxy
    restart: unless-stopped
    network_mode: "service:tailscale"
    depends_on:
      tailscale:
        condition: service_started
    environment:
      # --- 리스닝 (netns 공유라 127.0.0.1 로만, funnel 이 이 포트를 노출) ---
      OAUTH2_PROXY_HTTP_ADDRESS: "127.0.0.1:4180"

      # --- 보호 대상 (같은 netns 의 kirocrew) ---
      OAUTH2_PROXY_UPSTREAMS: "http://127.0.0.1:${KIROCREW_PORT:-5476}"

      # --- Google 공급자 ---
      OAUTH2_PROXY_PROVIDER: "google"
      OAUTH2_PROXY_CLIENT_ID: "${OAUTH2_GOOGLE_CLIENT_ID:-}"
      OAUTH2_PROXY_CLIENT_SECRET: "${OAUTH2_GOOGLE_CLIENT_SECRET:-}"

      # 공개 FQDN 기준 콜백. Google Console 의 Authorized redirect URI 와 반드시 일치.
      OAUTH2_PROXY_REDIRECT_URL: "https://${OAUTH2_PUBLIC_FQDN}/oauth2/callback"

      # --- 접근 허용 범위: 이메일 화이트리스트 (쉼표 구분) ---
      # 특정 Gmail 계정만: user1@gmail.com,user2@gmail.com
      # 조직 도메인 전체면 OAUTH2_PROXY_EMAIL_DOMAINS 로 바꿔 쓸 것.
      OAUTH2_PROXY_AUTHENTICATED_EMAILS_FILE: "/etc/oauth2-proxy/authenticated_emails.txt"

      # --- 쿠키 (세션 암호화 키) ---
      # 함정: 정확히 16/24/32 '바이트' 여야 한다. `openssl rand -base64 32` 의 출력은
      # 44글자라 44바이트로 읽혀 거부된다. 32글자 평문을 쓸 것:
      #   OAUTH2_COOKIE_SECRET=$(LC_ALL=C tr -dc 'A-Za-z0-9' </dev/urandom | head -c 32)
      OAUTH2_PROXY_COOKIE_SECRET: "${OAUTH2_COOKIE_SECRET:-}"
      OAUTH2_PROXY_COOKIE_SECURE: "true"       # funnel 은 항상 HTTPS

      # --- 리버스 프록시 뒤에 있음(Funnel) + 전체 경로 보호 ---
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"          # 화이트리스트 파일로 좁히므로 여기선 전체 허용
      # kirocrew 가 Host 헤더를 검사하므로, 통과시킬 때 FQDN Host 를 유지한다.
      OAUTH2_PROXY_PASS_HOST_HEADER: "true"

    volumes:
      # 허용 이메일 목록 (한 줄에 하나). 이 파일을 만들어 둘 것 (가이드 참조).
      - ./authenticated_emails.txt:/etc/oauth2-proxy/authenticated_emails.txt:ro

  # ---------------------------------------------------------------------------
  # KiroCrew 게이트웨이. tailscale 컨테이너의 네트워크를 그대로 공유한다.
  # ---------------------------------------------------------------------------
  kirocrew:
    image: ghcr.io/kirodotdev/kirocrew:stable
    container_name: kirocrew
    restart: unless-stopped

    # 네임스페이스 공유. 이 줄 때문에 kirocrew 에는 ports/networks 를 쓸 수 없다.
    #
    # 주의 -- 실제로 겪은 함정: tailscale 컨테이너가 재시작하면 공유 netns 가
    # 새로 만들어지고, 먼저 떠 있던 이 컨테이너는 죽은 netns 를 붙들고 남는다.
    # 증상이 헷갈린다: loopback 은 살아 있어서 healthcheck 는 계속 healthy 인데
    # 라우팅 테이블이 비고 DNS 가 전멸해서, 컨테이너 안의 모든 외부 통신이
    # "Could not resolve host" / "dispatch failure" 로 실패한다.
    # => tailscale 을 재시작/재생성했으면 반드시 kirocrew 도 재시작할 것:
    #    docker compose restart kirocrew   (kirocrew.sh 가 자동으로 처리한다)
    network_mode: "service:tailscale"
    depends_on:
      tailscale:
        # service_healthy 가 아니라 started: 대화형 로그인 대기 중에도
        # 게이트웨이는 떠 있어야 하고, 네임스페이스는 인증과 무관하게 존재한다.
        condition: service_started

    environment:
      # 컨테이너 내부 리스닝 포트. 저장된 config 의 dashboard.url 보다 우선한다.
      KIROCREW_PORT: "${KIROCREW_PORT:-5476}"

      # 이미지에 이미 0.0.0.0 이 박혀 있다. 명시해 두는 이유는 이 값이
      # loopback 으로 좁아지면 tailscale userspace 프록시와 docker 포트 발행
      # 양쪽이 동시에 죽기 때문 -- 조용히 바뀌면 안 되는 값이다.
      KIROCREW_BIND: "0.0.0.0"

      # tailnet 이름으로 접속하기 위한 필수 설정.
      # 게이트웨이는 서비스하지 않는 Host 헤더를 DNS-rebinding 방어로 403 거절하며,
      # 기본 허용 목록은 localhost/127.0.0.1/::1/kirocrew.localhost 뿐이다.
      # 이 변수는 CSRF Origin 허용 목록과 Host 허용 목록에 동시에 반영된다.
      # 예: http://kirocrew.tail1a2b3c.ts.net:15476
      KIROCREW_CORS_ORIGINS: "${KIROCREW_CORS_ORIGINS:-}"

      # HOST_PORT != KIROCREW_PORT 로 둘 때 브라우저가 보내는
      # Origin(호스트 포트)과 게이트웨이가 아는 포트가 어긋나는 것을 메운다.
      KIROCREW_ALLOWED_LOOPBACK_PORTS: "${HOST_PORT:-5476}"

    volumes:
      - kirocrew-home:/home/kirocrew

    # 프로필 json 은 이 compose 파일과 같은 디렉터리에 있어야 한다.
    # 주의(Rancher Desktop): seccomp 프로필은 dockerd(moby) 백엔드에서만 적용된다.
    # containerd 백엔드로 전환돼 있으면 docker compose 자체가 동작하지 않으니
    # Rancher Desktop > Preferences > Container Engine 을 dockerd(moby) 로 둘 것.
    security_opt:
      - seccomp:./kirocrew-seccomp.json

volumes:
  kirocrew-home:
    # name 을 명시해야 <project>_kirocrew-home 이 아닌
    # 기존 docker run 이 만든 kirocrew-home 볼륨을 그대로 재사용한다.
    name: kirocrew-home
  tailscale-state:
    name: kirocrew-tailscale-state
